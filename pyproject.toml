[tool.poetry]
name = "docker-tskit"
version = "0.5.1"
description = "Docker image with tskitetude software"
authors = ["Paolo Cozzi <bunop@libero.it>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
tskitetude = {git = "https://github.com/bunop/TSKITetude.git", rev = "89b06c1a5f3e8a545d691fe8157312e46930a2e5"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
